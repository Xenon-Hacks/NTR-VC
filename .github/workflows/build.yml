name: Build NTR-VC
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish as a GitHub release (leave empty to only build)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: minimal
          update: true
          install: |
            zip
            make
            git
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
      - uses: actions/checkout@v5
      - name: Build
        run: |
          mkdir -p lib
          set +e
          make -j$(nproc) LITE=1 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # show the compiler errors as annotations on the run page
            grep -E "error|Error|\*\*\*" build.log | head -30 | sed 's/^/::error::/'
          fi
          exit $status
      - name: Package
        run: |
          mkdir -p pkg/licenses
          cp ntrviewer.exe LICENSE THIRD_PARTY_NOTICES.md README.md NTR-VC.md pkg/
          cp tools/ds_test_sender.py pkg/
          cp licenses/* pkg/licenses/
          cp LICENSE-kcp pkg/licenses/kcp-LICENSE
          cp nuklear/LICENSE-original pkg/licenses/nuklear-LICENSE
          cp fecal/LICENSE-original.md pkg/licenses/fecal-LICENSE.md
          cp jpeg_turbo/LICENSE.md pkg/licenses/libjpeg-turbo-LICENSE.md
          cp clarity/LICENSE.md pkg/licenses/clarity-LICENSE.md
          cp rapidjson/license.txt pkg/licenses/rapidjson-LICENSE.txt
          cp models-se/LICENSE pkg/licenses/realcugan-models-LICENSE
          sed -n '/available under 2 licenses/,$p' stb_image.h > pkg/licenses/stb_image-LICENSE.txt
          # Licenses of the MSYS2 libraries linked into the exe
          for p in sdl3 libiconv winpthreads mingw-w64-crt headers-git; do
            for d in /mingw64/share/licenses/*; do
              case "$(basename "$d" | tr A-Z a-z)" in *"$p"*) cp -r "$d" "pkg/licenses/msys2-$(basename "$d")";; esac
            done
          done
          ls -R pkg
          (cd pkg && zip -r ../NTR-VC-Win-x64.zip .)
          # Full source of this build, for the LGPL relinking offer (SDL3 / libiconv are static)
          git config --global --add safe.directory '*'
          git archive --format=zip --prefix=NTR-VC-source/ -o NTR-VC-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: NTR-VC-Win-x64
          path: NTR-VC-Win-x64.zip
      - name: Publish release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: NTR-VC v${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            NTR-VC-Win-x64.zip
            NTR-VC-source.zip
          body: |
            NTR-VC is a fork of NTRViewer-HR by xzn (https://github.com/xzn/ntrviewer-hr, MIT License) with frame and audio sharing for bots, saved settings, a diagnostic log and automatic stream-drop recovery.

            Download NTR-VC-Win-x64.zip, unzip it and run ntrviewer.exe. License files are in its licenses folder, and NTR-VC.md describes every change. NTR-VC-source.zip is the full source of this build.
